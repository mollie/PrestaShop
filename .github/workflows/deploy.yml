name: Deploy

on:
    pull_request:
        types: [closed]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            # IF YOU EDIT THESE TWO STEPS, DON'T FORGET TO EDIT release.yml
            - name: Install Composer dependencies
              env:
                COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
              run: |
                  composer install --no-dev --optimize-autoloader --classmap-authoritative
                  composer dump-autoload --no-dev --optimize --classmap-authoritative
            - name: build
              run: |
                  npm install --quiet --no-progress
                  rm -rf node_modules
                  rm -rf .git
                  rm -rf .github
                  rm -rf tests
                  rm -rf patches
                  rm -rf .docker
                  rm -rf vendor/segmentio/analytics-php/.buildscript
                  rm -rf vendor/segmentio/analytics-php/.circleci
                  rm -rf vendor/segmentio/analytics-php/.github
                  mkdir mollie
                  rsync -Rr ./ ./mollie
                  shopt -s extglob
                  rm -r !(mollie)
                  find . -maxdepth 1 -type f -exec rm "{}" \;
                  cd mollie && rm -rf mollie
            - name: Archive production artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: mollie
                  path: |
                      .
